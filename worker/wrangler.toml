name = "sveta-colours-chat"
main = "chat-worker.js"
compatibility_date = "2026-10-01"

[vars]
OPENAI_MODEL = "gpt-5.4-mini"

# Per-visitor (per-IP) limit: 10 messages a minute.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# OPENAI_API_KEY is a secret — never put it in this file:
#   echo "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
