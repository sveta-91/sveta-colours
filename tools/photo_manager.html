<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sveta Colours — Photo Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #EAE6DE;
  --surface: #F2EFE8;
  --surface-alt: #E0DBD1;
  --paper: #F7F5EF;
  --border: #D6CFC1;
  --border-strong: #BFB6A4;
  --hairline: rgba(20, 19, 15, 0.12);

  --text: #14130F;
  --text-secondary: #3B362D;
  --text-muted: #6B6357;
  --text-faint: #6B6258;

  --accent: #1A2640;
  --accent-hover: #2A3A5C;
  --success: #1F5132;
  --danger: #7A1F1F;

  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-1: 0 1px 2px var(--hairline);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { background: var(--bg); color: var(--text); font-family: var(--font-body); }
body { padding: 1.5rem; line-height: 1.5; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 500; color: var(--text); }
h1 { font-size: 1.75rem; margin-bottom: 1rem; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

.top-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.5rem; align-items: start; }
.col-right { display: flex; flex-direction: column; gap: 1rem; }
.bottom-section { margin-top: 1.5rem; }

@media (max-width: 800px) {
  .top-layout { grid-template-columns: 1fr; }
}

.card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; }
.card-title { font-family: var(--font-display); font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 0.75rem; }

.drop-zone { border: 2px dashed var(--border-strong); border-radius: var(--radius-md); padding: 3rem 1rem; text-align: center; cursor: pointer; background: var(--surface); transition: background 0.15s, border-color 0.15s; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.drop-zone:hover, .drop-zone:focus-visible, .drop-zone.drag-over { background: var(--surface-alt); border-color: var(--accent); outline: none; }
.drop-zone:focus-visible { box-shadow: 0 0 0 3px rgba(26,38,64,0.25); }
.drop-zone p { color: var(--text-secondary); }
.drop-zone small { color: var(--text-faint); font-size: 0.85em; }

input[type=file] { position: absolute; left: -9999px; }

.canvas-area { position: relative; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; min-height: 180px; display: flex; align-items: center; justify-content: center; }
#preview-canvas { max-width: 100%; display: block; border-radius: var(--radius-md); }

.tool-bar { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }

button { cursor: pointer; font-family: var(--font-body); font-size: 0.9rem; padding: 0.5rem 0.95rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--paper); color: var(--text); display: inline-flex; align-items: center; gap: 0.35rem; transition: background 0.12s, border-color 0.12s; }
button:hover { background: var(--surface-alt); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

input[type=text], input[type=number], select, textarea { font-family: var(--font-body); font-size: 0.9rem; padding: 0.45rem 0.65rem; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--paper); color: var(--text); width: 100%; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

.field-row { display: flex; gap: 0.5rem; align-items: flex-start; margin-bottom: 0.6rem; }
.field-row label { font-size: 0.85rem; color: var(--text-secondary); min-width: 80px; padding-top: 0.55rem; flex-shrink: 0; }

.btn-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }

.status { font-size: 0.85rem; color: var(--text-faint); margin-top: 0.4rem; min-height: 1.2em; }
.status.ok { color: var(--success); }
.status.err { color: var(--danger); }

.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

hr.divider { border: 0; border-top: 1px solid var(--border); margin: 0.75rem 0; }
</style>
</head>
<body>
  <h1 class="sr-only">Photo Manager</h1>

  <main class="top-layout">
    <section class="col-left" aria-labelledby="canvas-h">
      <div class="card">
        <h2 id="canvas-h" class="card-title">Canvas</h2>

        <label id="dropZone" class="drop-zone" for="fileInput" tabindex="0" role="button"
               aria-label="Upload an image: drag a file here or press Enter to browse">
          <i class="ti ti-upload" aria-hidden="true" style="font-size:36px;color:var(--text-faint)"></i>
          <p>Drag &amp; drop or press Enter to upload</p>
          <small>JPG, PNG, WEBP, HEIC — any size</small>
        </label>
        <input type="file" id="fileInput" accept="image/*,.heic,.heif">

        <div id="workArea" hidden>
          <div class="tool-bar" role="toolbar" aria-label="Image tools">
            <button type="button" onclick="resetToOriginal()">Reset</button>
          </div>
          <div class="canvas-area" id="canvasArea">
            <canvas id="preview-canvas" aria-label="Image preview"></canvas>
          </div>
          <div class="status" id="dimInfo" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <aside class="col-right" aria-label="Controls">
      <!-- Adjustments -->
      <div class="card">
        <h2 class="card-title">Adjustments</h2>
        <div class="field-row">
          <label for="brightness">Brightness</label>
          <input type="range" id="brightness" min="-100" max="100" value="0" step="1">
          <span id="bv" aria-live="off">0</span>
        </div>
        <div class="field-row">
          <label for="contrast">Contrast</label>
          <input type="range" id="contrast" min="-100" max="100" value="0" step="1">
          <span id="cv" aria-live="off">0</span>
        </div>
        <div class="field-row">
          <label for="saturation">Saturation</label>
          <input type="range" id="saturation" min="-100" max="100" value="0" step="1">
          <span id="sv" aria-live="off">0</span>
        </div>
        <hr class="divider">
        <div class="field-row">
          <label for="wmOpacity">Watermark opacity</label>
          <input type="range" id="wmOpacity" min="0" max="100" value="40" step="1">
          <span id="wov" aria-live="off">40</span>
        </div>
        <div class="field-row">
          <label for="wmText">Watermark text</label>
          <input type="text" id="wmText" value="© sveta-colours" placeholder="Watermark text">
          <button type="button" onclick="applyAll()">Refresh</button>
        </div>
      </div>

      <!-- Export -->
      <div class="card">
        <h2 class="card-title">Export</h2>
        <div class="field-row">
          <label for="exportFormat">Format</label>
          <select id="exportFormat">
            <option value="jpeg" selected>JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WEBP</option>
          </select>
        </div>
        <div class="field-row" id="qualityRow">
          <label for="jpegQuality">Quality</label>
          <input id="jpegQuality" type="range" min="10" max="100" value="90">
          <span id="qv" aria-live="off">90%</span>
        </div>
        <div class="btn-row">
          <button type="button" onclick="downloadImg()">Download</button>
          <button type="button" class="primary" onclick="saveAll()" id="btnSaveAll">Save to Drive + Sheets</button>
        </div>
        <div class="status" id="saveStatus" aria-live="polite" role="status"></div>
      </div>
    </aside>
  </main>

  <section class="bottom-section" id="bottomLayout">
    <form class="card" id="portfolioForm" onsubmit="event.preventDefault()">
      <h2 class="card-title">Portfolio record</h2>
      <fieldset style="border:0;padding:0">
        <legend class="sr-only">Painting metadata</legend>
        <div class="field-row"><label for="fTitle">Title *</label><input id="fTitle" type="text" required></div>
        <div class="field-row"><label for="fDesc">Description</label><textarea id="fDesc" rows="3"></textarea></div>
        <div class="field-row"><label for="fMedium">Medium</label><input id="fMedium" type="text" placeholder="oil on canvas"></div>
        <div class="field-row"><label for="fSize">Size (cm)</label><input id="fSize" type="text" placeholder="40×50"></div>
        <div class="field-row"><label for="fYear">Year</label><input id="fYear" type="text"></div>
        <div class="field-row">
          <label for="fCollection">Collection</label>
          <input id="fCollection" type="text" list="collectionsList" placeholder="pick existing or type new">
          <datalist id="collectionsList"></datalist>
        </div>
        <div class="field-row"><label for="fStatus">Status</label>
          <select id="fStatus">
            <option value="">—</option>
            <option value="available">Available</option>
            <option value="sold">Sold</option>
            <option value="reserved">Reserved</option>
            <option value="not for sale">Not for sale</option>
          </select>
        </div>
        <div class="field-row"><label for="fPrice">Price</label><input id="fPrice" type="text" placeholder="350 CAD"></div>
        <div class="field-row"><label for="fNotes">Notes</label><input id="fNotes" type="text"></div>
      </fieldset>
    </form>
  </section>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
const DRIVE_FOLDER='1M8wTOfPAYeJZZL6d7RYo2DLtIapuxDOX';
const SHEET_ID='170BuYN45Wk7H2g31gfRo35quok76JwrhFB8YV4-ckfI';
const CLIENT_ID='754552250731-hdl67ujna2lk1lataah35mnl69emi8qt.apps.googleusercontent.com';
const SHEET_TAB='Paintings';
const COLS=['title','medium','price','sold','size','image','description','collection','featured','date','year','notes'];

// Form fields that take their default from "most common non-empty value" in the
// corresponding sheet column. fStatus is excluded because the form's status enum
// doesn't round-trip with the sheet's yes/no `sold` column. `description`, `notes`,
// and `price` are also in here but typically have unique values per row, so the
// most-common pass usually yields nothing — harmless no-op.
const DEFAULT_FIELD_TO_COL = {
  fMedium: 'medium',
  fSize:   'size',
  fYear:   'year',
  fPrice:  'price',
  fDesc:   'description',
  fNotes:  'notes',
};

const state = {
  origImg: null,                                  // EXIF-corrected source canvas
  fullCanvas: document.createElement('canvas'),   // FULL RESOLUTION — source of truth
  cachedToken: null,
  cachedTokenExpiresAt: 0,                        // ms epoch
  saveInFlight: false,
  _cachedRows: null,                              // last fetched Paintings rows; invalidated on Save
};
const fullCtx = state.fullCanvas.getContext('2d', { willReadFrequently: false });

const canvas=document.getElementById('preview-canvas');
const ctx=canvas.getContext('2d');

function setStatus(id, msg, kind) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('ok', 'err');
  if (kind) el.classList.add(kind);
}

// ── Upload ──
const dz=document.getElementById('dropZone');
const fi=document.getElementById('fileInput');
dz.addEventListener('click',()=>fi.click());
dz.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    fi.click();
  }
});
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');handleFile(e.dataTransfer.files[0]);});
fi.addEventListener('change',()=>handleFile(fi.files[0]));

['brightness','contrast','saturation','wmOpacity'].forEach(id=>{
  const map={brightness:'bv',contrast:'cv',saturation:'sv',wmOpacity:'wov'};
  document.getElementById(id).addEventListener('input',function(){document.getElementById(map[id]).textContent=this.value;applyAll();});
});
document.getElementById('jpegQuality').addEventListener('input',function(){document.getElementById('qv').textContent=this.value+'%';});
document.getElementById('exportFormat').addEventListener('change',function(){document.getElementById('qualityRow').style.display=this.value==='png'?'none':'flex';});

// Returns EXIF orientation 1–8, or 1 if missing/unparseable.
function readExifOrientation(arrayBuffer){
  const v=new DataView(arrayBuffer);
  if(v.byteLength<4||v.getUint16(0)!==0xFFD8) return 1; // not JPEG
  let off=2;
  while(off<v.byteLength){
    if(off+2>v.byteLength) return 1;
    const marker=v.getUint16(off);
    off+=2;
    if(marker===0xFFE1){ // APP1
      if(off+8>v.byteLength) return 1;
      if(v.getUint32(off+2)!==0x45786966) return 1; // "Exif"
      const tiff=off+8;
      if(tiff+8>v.byteLength) return 1;
      const little=v.getUint16(tiff)===0x4949;
      const get16=o=>v.getUint16(o,little);
      const get32=o=>v.getUint32(o,little);
      const ifd=tiff+get32(tiff+4);
      if(ifd+2>v.byteLength) return 1;
      const entries=get16(ifd);
      for(let i=0;i<entries;i++){
        const entry=ifd+2+i*12;
        if(entry+10>v.byteLength) return 1;
        if(get16(entry)===0x0112) return get16(entry+8);
      }
      return 1;
    }
    if((marker&0xFF00)!==0xFF00) return 1;
    if(off+2>v.byteLength) return 1;
    off+=v.getUint16(off);
  }
  return 1;
}

// Bake EXIF orientation into a fresh canvas. Returns a canvas.
function applyOrientationToCanvas(img, o){
  const c=document.createElement('canvas');
  const ctx2=c.getContext('2d');
  const w=img.width, h=img.height;
  if(o>=5 && o<=8){ c.width=h; c.height=w; }
  else { c.width=w; c.height=h; }
  switch(o){
    case 2: ctx2.translate(w,0); ctx2.scale(-1,1); break;
    case 3: ctx2.translate(w,h); ctx2.rotate(Math.PI); break;
    case 4: ctx2.translate(0,h); ctx2.scale(1,-1); break;
    case 5: ctx2.rotate(0.5*Math.PI); ctx2.scale(1,-1); break;
    case 6: ctx2.rotate(0.5*Math.PI); ctx2.translate(0,-h); break;
    case 7: ctx2.rotate(0.5*Math.PI); ctx2.translate(w,-h); ctx2.scale(-1,1); break;
    case 8: ctx2.rotate(-0.5*Math.PI); ctx2.translate(-w,0); break;
  }
  ctx2.drawImage(img,0,0);
  return c;
}

function handleFile(file){
  if(!file) return;
  if(!file.type.startsWith('image/') && !/\.(heic|heif)$/i.test(file.name)){
    setStatus('saveStatus','Only image files (JPG, PNG, WEBP, HEIC) supported.','err');
    return;
  }

  const reader=new FileReader();
  reader.onload=e=>{
    const buf=e.target.result;
    const orientation = file.type==='image/jpeg' ? readExifOrientation(buf) : 1;
    const blob=new Blob([buf],{type:file.type||'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      setStatus('saveStatus','Could not decode image (corrupted or unsupported format).','err');
    };
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const oriented=applyOrientationToCanvas(img,orientation);
      state.origImg=oriented;
      setupCanvasFromCanvas(oriented);
      dz.style.display='none';
      document.getElementById('workArea').style.display='block';

      // Fresh entry — clear form, seed title from filename, year=current, then layer
      // sheet-derived defaults: if the title matches an existing row, fill from it;
      // otherwise fall back to most-common.
      resetForm();
      const name=file.name.replace(/\.[^.]+$/,'');
      document.getElementById('fTitle').value=name;
      document.getElementById('fYear').value=String(new Date().getFullYear());
      loadAndApplyDefaults().catch(()=>{ /* silent — defaults reload after Save */ });

      drawPreview();
    };
    img.src=url;
  };
  reader.readAsArrayBuffer(file);
}

// Used by transforms (and resetToOriginal) that produce a new canvas.
function setupCanvasFromCanvas(srcCanvas){
  state.fullCanvas.width = srcCanvas.width;
  state.fullCanvas.height = srcCanvas.height;
  fullCtx.drawImage(srcCanvas, 0, 0);
  fitPreviewToFull();
  updateDimInfo();
}

function fitPreviewToFull(){
  const area = document.getElementById('canvasArea');
  const maxW = area.clientWidth || 600, maxH = 460;
  const fw = state.fullCanvas.width || 1, fh = state.fullCanvas.height || 1;
  const scale = Math.min(maxW / fw, maxH / fh, 1);
  canvas.width = Math.round(fw * scale);
  canvas.height = Math.round(fh * scale);
  drawPreview();
}

function updateDimInfo(){
  setStatus('dimInfo',
    `${state.fullCanvas.width} × ${state.fullCanvas.height} px (preview ${canvas.width}×${canvas.height})`);
}

function drawPreview(){
  if(!state.fullCanvas.width) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.filter = buildFilter();
  ctx.drawImage(state.fullCanvas, 0, 0, canvas.width, canvas.height);
  ctx.filter = 'none';
  drawWatermarkOnContext(ctx, canvas.width, canvas.height);
}

// Thin wrapper kept for legacy callers (slider listeners, watermark Refresh).
function applyAll(){
  drawPreview();
}

function buildFilter(){const b=+document.getElementById('brightness').value,c=+document.getElementById('contrast').value,s=+document.getElementById('saturation').value;return `brightness(${1+b/100}) contrast(${1+c/100}) saturate(${1+s/100})`;}

function drawWatermarkOnContext(c, w, h){
  const text = document.getElementById('wmText').value.trim();
  if (!text) return;
  const op = +document.getElementById('wmOpacity').value / 100;
  const fs = Math.max(12, Math.round(w / 24));
  c.save();
  c.font = `${fs}px sans-serif`;
  c.fillStyle = `rgba(255,255,255,${op})`;
  c.strokeStyle = `rgba(0,0,0,${op * 0.5})`;
  c.lineWidth = Math.max(1, fs / 16);
  c.textAlign = 'right';
  c.textBaseline = 'bottom';
  const x = w - Math.round(w / 100);
  const y = h - Math.round(h / 100);
  c.strokeText(text, x, y);
  c.fillText(text, x, y);
  c.restore();
}

// Compose a Blob from the full-res canvas with filters + watermark applied.
async function composeFullBlob(format = 'image/jpeg', quality = 0.9){
  const out = document.createElement('canvas');
  out.width = state.fullCanvas.width;
  out.height = state.fullCanvas.height;
  const octx = out.getContext('2d');
  octx.filter = buildFilter();
  octx.drawImage(state.fullCanvas, 0, 0);
  octx.filter = 'none';
  drawWatermarkOnContext(octx, out.width, out.height);
  return await new Promise(r => out.toBlob(r, format, quality));
}

function resetToOriginal(){
  if(!state.origImg)return;
  setupCanvasFromCanvas(state.origImg);
  ['brightness','contrast','saturation'].forEach(id=>{document.getElementById(id).value=0;});
  ['bv','cv','sv'].forEach(id=>{document.getElementById(id).textContent='0';});
  document.getElementById('wmOpacity').value=40;document.getElementById('wov').textContent='40';
}

// ── EXPORT ──
function getMime(){const f=document.getElementById('exportFormat').value;return f==='png'?'image/png':f==='webp'?'image/webp':'image/jpeg';}
function getExt(){const f=document.getElementById('exportFormat').value;return f==='jpeg'?'jpg':f;}
function getQ(){return+document.getElementById('jpegQuality').value/100;}

async function downloadImg(){
  if(!state.origImg){setStatus('saveStatus','Upload an image first','err');return;}
  const mime=getMime(),q=getQ();
  const blob=await composeFullBlob(mime,q);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(document.getElementById('fTitle').value.trim()||'photo')+'.'+getExt();
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

// ── FORM ──
function resetForm(){
  for (const id of ['fTitle','fDesc','fMedium','fSize','fYear','fCollection','fPrice','fNotes']){
    const el=document.getElementById(id);
    if (el) el.value='';
  }
  const status=document.getElementById('fStatus');
  if (status) status.value='';
}

// ── DEFAULTS FROM SHEET ──
// Two-step fill, applied at upload and whenever the title field changes:
//   1) if the typed title matches an existing row, fill empty fields from THAT row
//      (so re-typing a previous painting brings up its metadata)
//   2) otherwise fall back to per-column most-common across all rows
// Always populates the Collection datalist with distinct existing values for autocomplete.
// Requests OAuth on first use; subsequent calls reuse the cached token. If the user
// dismisses the popup, silently bails — they can still type values manually.
async function loadAndApplyDefaults(){
  let token;
  try {
    token = await getAccessToken();
  } catch (e) {
    return;  // OAuth dismissed or unavailable — fall through to placeholders
  }
  if (!state._cachedRows){
    state._cachedRows = await fetchAllRows(token);
  }
  applyDefaultsFromRows(state._cachedRows);
}

async function fetchAllRows(token){
  const lastCol = String.fromCharCode(64 + COLS.length); // 'L' for 12 columns
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_TAB}!A:${lastCol}`,
    { headers: { Authorization: 'Bearer ' + token } }
  );
  if (!res.ok) throw new Error('Sheets read failed: ' + res.status);
  return (await res.json()).values || [];
}

function applyDefaultsFromRows(rows){
  // Header in row 0; bail if sheet has no data rows.
  if (rows.length <= 1) return;
  const data = rows.slice(1);

  populateCollectionDatalist(data);

  const title = document.getElementById('fTitle').value.trim();
  if (title){
    const titleIdx = COLS.indexOf('title');
    const normT = normalizeTitle(title);
    const matched = data.find(r => normalizeTitle(r[titleIdx] || '') === normT);
    if (matched){
      fillFromRow(matched);
      return;
    }
  }
  fillFromMostCommon(data);
}

// Map sheet column → form field id, used by both row-match and most-common fills.
const COL_TO_FIELD = {
  description: 'fDesc',
  medium:      'fMedium',
  price:       'fPrice',
  size:        'fSize',
  collection:  'fCollection',
  year:        'fYear',
  notes:       'fNotes',
};

function fillFromRow(row){
  for (const [colName, fieldId] of Object.entries(COL_TO_FIELD)){
    const idx = COLS.indexOf(colName);
    if (idx < 0) continue;
    const val = (row[idx] || '').trim();
    if (!val) continue;
    const el = document.getElementById(fieldId);
    if (!el || el.value.trim()) continue;  // never clobber typed input
    el.value = val;
  }
  // Status maps from `sold` column: 'yes' → 'sold'. 'no' is ambiguous
  // (could be available/reserved/not-for-sale), so we leave the select blank.
  const soldIdx = COLS.indexOf('sold');
  if (soldIdx >= 0){
    const sold = (row[soldIdx] || '').trim().toLowerCase();
    const st = document.getElementById('fStatus');
    if (sold === 'yes' && st && !st.value) st.value = 'sold';
  }
}

function fillFromMostCommon(data){
  for (const [fieldId, colName] of Object.entries(DEFAULT_FIELD_TO_COL)){
    const el = document.getElementById(fieldId);
    if (!el || el.value.trim()) continue;
    const idx = COLS.indexOf(colName);
    if (idx < 0) continue;
    const counts = new Map();
    for (const r of data){
      const v = (r[idx] || '').trim();
      if (!v) continue;
      counts.set(v, (counts.get(v) || 0) + 1);
    }
    let best = '', bestCount = 0;
    for (const [v, c] of counts){
      if (c > bestCount){ best = v; bestCount = c; }
    }
    if (best) el.value = best;
  }
}

function populateCollectionDatalist(data){
  const cIdx = COLS.indexOf('collection');
  if (cIdx < 0) return;
  const collections = new Set();
  for (const r of data){
    const v = (r[cIdx] || '').trim();
    if (v) collections.add(v);
  }
  const dl = document.getElementById('collectionsList');
  if (!dl) return;
  dl.textContent = '';
  for (const c of [...collections].sort((a,b)=>a.localeCompare(b))){
    const opt = document.createElement('option');
    opt.value = c;
    dl.appendChild(opt);
  }
}

// Re-apply defaults when the user types a title and tabs out — picks up an
// existing row's values if the title matches, otherwise most-common.
document.getElementById('fTitle').addEventListener('change', ()=>{
  loadAndApplyDefaults().catch(()=>{});
});

// ── GOOGLE AUTH ──
function getAccessToken() {
  return new Promise((resolve, reject) => {
    if (state.cachedToken && Date.now() < state.cachedTokenExpiresAt) return resolve(state.cachedToken);
    if (!window.google?.accounts?.oauth2) return reject(new Error('GIS not loaded'));
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets',
      callback: r => {
        if (r.error) return reject(new Error('OAuth: ' + r.error));
        state.cachedToken = r.access_token;
        state.cachedTokenExpiresAt = Date.now() + (r.expires_in - 30) * 1000;
        resolve(r.access_token);
      },
      error_callback: err => reject(new Error('OAuth cancelled: ' + (err && err.type)))
    });
    client.requestAccessToken();
  });
}

// ── SAVE ALL ──
async function saveAll() {
  if (state.saveInFlight) return;
  if (!state.origImg) { setStatus('saveStatus', 'Upload an image first', 'err'); return; }
  state.saveInFlight = true;
  const btn = document.getElementById('btnSaveAll');
  btn.disabled = true;
  setStatus('saveStatus', 'Saving…');
  try {
    const token = await getAccessToken();
    const driveFileId = await uploadToDrive(token);
    const oldFileId = await upsertSheetRow(token, driveFileId);
    // Clean up the previous Drive file for this title — only after the new row write succeeded,
    // so a failure here can't strand the Sheets row pointing at a deleted file.
    if (oldFileId && oldFileId !== driveFileId) {
      deleteDriveFile(token, oldFileId).catch(e => console.warn('orphan cleanup:', e));
    }
    setStatus('saveStatus', 'Saved.', 'ok');
    // We have a fresh token + the row we just wrote — invalidate the row cache so
    // the next upload / title change sees up-to-date most-common and any new Collection.
    state._cachedRows = null;
    loadAndApplyDefaults().catch(()=>{});
  } catch (e) {
    setStatus('saveStatus', 'Save failed: ' + e.message, 'err');
  } finally {
    state.saveInFlight = false;
    btn.disabled = false;
  }
}

async function uploadToDrive(token) {
  const fmt = document.getElementById('exportFormat').value;
  const mime = fmt === 'png' ? 'image/png' : fmt === 'webp' ? 'image/webp' : 'image/jpeg';
  const q = +document.getElementById('jpegQuality').value / 100;
  const blob = await composeFullBlob(mime, q);

  const title = (document.getElementById('fTitle').value.trim() || 'untitled') + '.' + fmt;
  const meta = { name: title, parents: [DRIVE_FOLDER] };

  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  form.append('file', blob);

  const res = await fetch(
    'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',
    { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: form }
  );
  if (!res.ok) throw new Error('Drive upload failed: ' + res.status);
  const j = await res.json();
  return j.id;
}

// Sheets RAW already prevents formula execution, but normalize for dedup/display.
function sanitizeCell(s) {
  if (s == null) return '';
  return String(s).replace(/\r\n/g, '\n').trim();
}

function normalizeTitle(s) {
  return sanitizeCell(s).toLowerCase().replace(/\s+/g, ' ');
}

async function upsertSheetRow(token, driveFileId) {
  // 1) Read existing A:F so we know both the dedup target (col A) and any prior file ID (col F).
  const readRes = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_TAB}!A:F`,
    { headers: { Authorization: 'Bearer ' + token } }
  );
  if (!readRes.ok) throw new Error('Sheets read failed: ' + readRes.status);
  const rows = (await readRes.json()).values || [];

  // 2) Header row only initialized if sheet is completely empty.
  // We do NOT overwrite an existing header — the user owns the schema and we extend it on append.
  if (rows.length === 0) {
    const headRes = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_TAB}!A1?valueInputOption=RAW`,
      { method: 'PUT', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: [COLS] }) }
    );
    if (!headRes.ok) throw new Error('Sheets header init failed: ' + headRes.status);
  }

  // 3) Compose row from form fields
  const title = document.getElementById('fTitle').value;
  const normTitle = normalizeTitle(title);
  const row = COLS.map(col => sanitizeCell(getCellForCol(col, driveFileId)));

  // 4) Find existing row by normalized title in column A; capture old Drive file ID from column F.
  let foundIdx = -1;
  let oldFileId = '';
  for (let i = 1; i < rows.length; i++) {
    if (rows[i] && normalizeTitle(rows[i][0] || '') === normTitle) {
      foundIdx = i;
      oldFileId = (rows[i][5] || '').trim();  // column F = image (Drive file ID)
      break;
    }
  }

  if (foundIdx >= 0) {
    const rowNum = foundIdx + 1;
    const range = `${SHEET_TAB}!A${rowNum}:${String.fromCharCode(64 + COLS.length)}${rowNum}`;
    const res = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?valueInputOption=RAW`,
      { method: 'PUT', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ range, values: [row] }) }
    );
    if (!res.ok) throw new Error('Sheets update failed: ' + res.status);
  } else {
    const res = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_TAB}!A1:append?valueInputOption=RAW`,
      { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: [row] }) }
    );
    if (!res.ok) throw new Error('Sheets append failed: ' + res.status);
  }

  return oldFileId;  // empty string if no prior row; caller may delete the orphan
}

// Best-effort delete of a Drive file. 404 (already gone) is treated as success;
// 403 (drive.file scope can't touch files we didn't create) is treated as success too —
// we don't want orphan cleanup to break a save.
async function deleteDriveFile(token, fileId) {
  if (!fileId) return;
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}`,
    { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } }
  );
  if (!res.ok && res.status !== 404 && res.status !== 403) {
    throw new Error('Drive delete failed: ' + res.status);
  }
}

function getCellForCol(col, driveFileId) {
  const status = (document.getElementById('fStatus').value || '').toLowerCase();
  const m = {
    'title': document.getElementById('fTitle').value,
    'medium': document.getElementById('fMedium').value,
    'price': document.getElementById('fPrice').value,
    'sold': status === 'sold' ? 'yes' : 'no',
    'size': document.getElementById('fSize').value,
    'image': driveFileId,
    'description': document.getElementById('fDesc').value,
    'collection': document.getElementById('fCollection').value,
    'featured': '', // manual flag — left blank for Sveta to set yes/no in the sheet
    'date': new Date().toISOString().slice(0, 10),
    'year': document.getElementById('fYear').value,
    'notes': document.getElementById('fNotes').value,
  };
  return m[col] || '';
}
