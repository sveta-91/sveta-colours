document.getElementById('contactModal').addEventListener('click', function(e) { if (e.target === this) closeContact(); });

function copyStudioEmail(btn) {
  const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy'; }, 1800); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(CONTACT_EMAIL).then(done, () => {});
      return;
    }
  } catch (e) { /* fall through */ }
  const t = document.createElement('textarea');
  t.value = CONTACT_EMAIL; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
  t.remove();
}

function applyAccentTint(p) {
  // Reset to default first
  document.documentElement.style.removeProperty('--accent-tint');
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  if (p.dominantColor) {
    document.documentElement.style.setProperty('--accent-tint', p.dominantColor);
    return;
  }

  // Sample from the modal image once it has loaded
  const img = document.querySelector('.modal-image img');
  if (!img) return;
  const finish = () => {
    try {
      const canvas = document.createElement('canvas');
      const W = 32, H = 32;
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, W, H);
      // Sample center 60% region (avoids edges / frame artifacts)
      const data = ctx.getImageData(W * 0.2, H * 0.2, W * 0.6, H * 0.6).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i+1]; b += data[i+2]; n++; }
      r = Math.round(r/n); g = Math.round(g/n); b = Math.round(b/n);
      // Mix with bone (#EAE6DE → 234,230,222) at 55% to desaturate
      const mix = (a, b) => Math.round(a * 0.55 + b * 0.45);
      const rm = mix(r, 234), gm = mix(g, 230), bm = mix(b, 222);
      document.documentElement.style.setProperty('--accent-tint', `rgb(${rm}, ${gm}, ${bm})`);
    } catch (e) {
      // CORS-tainted canvas — silently keep default accent
    }
  };
  if (img.complete && img.naturalWidth > 0) finish();
  else img.addEventListener('load', finish, { once: true });
}

// `closeModal(fromPopstate)` — when we're closing because a popstate event
// took us away from a #painting/<slug> URL, the history is already where it
// should be and we MUST NOT push or back again. When we're closing via X /
// ESC / backdrop, undo the history.pushState we did on open: history.back()
// if the topmost state is ours, else strip the hash with replaceState so the
// URL doesn't keep a stale #painting/<slug>.
function closeModal(fromPopstate) {
  const modalEl = document.getElementById('modal');
  if (!modalEl.classList.contains('open')) return;
  modalEl.classList.remove('open');
  document.body.style.overflow = '';
  document.title = pageTitleFor(currentPage);

  // Reset accent tint
  document.documentElement.style.removeProperty('--accent-tint');

  // Un-inert main
  const mainEl = document.querySelector('main');
  if (mainEl) {
    mainEl.removeAttribute('inert');
    mainEl.removeAttribute('aria-hidden');
  }

  if (!fromPopstate) {
    try {
      if (history.state && history.state.paintingId) {
        history.back();
      } else if (/#painting\//.test(window.location.hash)) {
        history.replaceState({ page: currentPage }, '', pageURL(currentPage));
      }
    } catch (e) { /* non-fatal */ }
  }

  // Guard against detached node (race: e.g. card was re-rendered while modal was open)
  if (lastFocusedElement && typeof lastFocusedElement.focus === 'function' && lastFocusedElement.isConnected) {
    lastFocusedElement.focus();
  }
}

// popstate: drive the modal from the URL. If the hash resolves to a painting,
// open it (without re-pushing); else close any open modal.
window.addEventListener('popstate', () => {
  const p = paintingFromHash(window.location.hash);
  if (p) {
    openModal(p.id, { pushHistory: false });
    return;
  }
  closeModal(true);
  const page = pageFromHash(window.location.hash);
  if (page && page !== currentPage) showPage(page, { fromHistory: true });
});

// Direct-link arrival: if the page loads with #painting/<slug>, open that modal
// once paintings are available. Called from loadFromSheet / the no-Sheet boot.
function hydrateFromHash() {
  const p = paintingFromHash(window.location.hash);
  if (p) openModal(p.id, { pushHistory: false });
}

document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeContact(); closeModal(); }
  // Focus trap inside modal
  if (e.key === 'Tab' && document.getElementById('modal').classList.contains('open')) {
    const focusables = Array.from(document.querySelectorAll('.modal a, .modal button, .modal input:not([type="hidden"]):not([tabindex="-1"]), .modal textarea, .modal [tabindex]:not([tabindex="-1"])'))
      .filter(el => el.offsetParent !== null);
    if (focusables.length === 0) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ========================================================
   CURATION HELPERS
   ======================================================== */

// Fallback list if the Sheet's `recent` column is empty across every row.
// Sheet wins when populated; this is the safety net so "Recent paintings"
// never empties out. Sold pieces ARE allowed — the home wall is editorial.
const FEATURED_TITLES = [
  'Where the Forest Breathes',
  'Autumn Light',
  'Morning Coffee',
  'Walking Home',
  'Frost and Sun',
];

/* selectFeatured — picks the home-page "Recent paintings" set.

   Resolution order:
     1) Sheet-driven: paintings with a `recent` integer set, sorted by
        that integer ascending, with an image and excluding the hero.
     2) Constant fallback FEATURED_TITLES, in declared order.
     3) Heuristic: featured-flag pins (up to 4) + available filler
        (image, !sold), de-clustered by orientation.

   When the Sheet or the constant pins the wall, order is preserved
   exactly — no interleave applied (the editor picked the order). */
function selectFeatured(paintings, count, excludeHeroId) {
  count = count || 6;
  const not = id => p => p.id !== id;
  const pool = paintings.filter(not(excludeHeroId));

  // Path 1 — sheet-driven by `recent` integer.
  const sheetRecent = pool
    .filter(p => typeof p.recent === 'number' && p.recent > 0 && p.image)
    .sort((a, b) => a.recent - b.recent)
    .slice(0, count);
  if (sheetRecent.length > 0) return sheetRecent;

  // Path 2 — constant title pin.
  if (FEATURED_TITLES && FEATURED_TITLES.length) {
    const byTitle = new Map();
    pool.forEach(p => {
      if (p.title && p.image) byTitle.set(p.title.toLowerCase().trim(), p);
    });
    const chosen = FEATURED_TITLES
      .map(t => byTitle.get(t.toLowerCase().trim()))
      .filter(Boolean)
      .slice(0, count);
    if (chosen.length > 0) return chosen;
  }

  // Path 3 — heuristic.
  const isShowable = p => p.available && !p.sold && p.image;
  const pinned = pool.filter(p => p.featured && isShowable(p)).slice(0, 4);
  const pinnedIds = new Set(pinned.map(p => p.id));
  const filler = pool.filter(p => isShowable(p) && !pinnedIds.has(p.id));
  const showable = pinned.concat(filler);
  return interleaveByOrientation(showable.slice(0, Math.min(count, showable.length)));
}

// Numeric w/h ratio for a painting (landscape > 1, portrait/square ≤ 1).
// Used by interleaveByOrientation; also a small lookup for the size-class.
function paintingRatio(p) {
  if (p.widthIn && p.heightIn && p.heightIn > 0) return p.widthIn / p.heightIn;
  if (p.size) {
    const m = p.size.match(/(\d+(?:\.\d+)?)\s*[x×]\s*(\d+(?:\.\d+)?)/i);
    if (m) {
      const w = parseFloat(m[1]), h = parseFloat(m[2]);
      if (h > 0) return w / h;
    }
  }
  return 4 / 5; // portrait default
}

// "Zip" portrait + landscape paintings so no more than 2 consecutive cards
// share orientation. Stable: relative order within each bucket is preserved.
// We start with whichever bucket is larger so any trailing run is shortest.
function interleaveByOrientation(items) {
  const landscape = items.filter(p => paintingRatio(p) > 1);
  const portrait  = items.filter(p => paintingRatio(p) <= 1);
  const out = [];
  let a = landscape.length >= portrait.length ? landscape.slice() : portrait.slice();
  let b = landscape.length >= portrait.length ? portrait.slice() : landscape.slice();
  while (a.length || b.length) {
    if (a.length) out.push(a.shift());
    if (b.length) out.push(b.shift());
  }
  return out;
}

/* Assigns a stable global catalog number to every painting (1-indexed in
   Sheet order). Same painting shows the same № wherever it appears. */
function assignCatalogNumbers() {
  PAINTINGS.forEach((p, i) => { p.catalogNumber = i + 1; });
}

// Fallback hero pin if the Sheet's `hero` column is unset. Sheet wins
// when populated; this is just the safety net so the home page never
// blanks if the column is empty or the editor forgot to tick a row.
const HERO_PIN_TITLE = 'Held Summer';

function getHeroPiece() {
  // Sold pieces are NEVER the hero — never put a "Sold" piece front-and-centre.
  const isShowable = p => p.available && !p.sold && p.image;

  // Sheet-driven pin (column `hero` truthy).
  const sheetHero = PAINTINGS.find(p => p.hero && isShowable(p));
  if (sheetHero) return sheetHero;

  // Constant fallback.
  if (HERO_PIN_TITLE) {
    const pinned = PAINTINGS.find(p =>
      p.title && p.title.toLowerCase() === HERO_PIN_TITLE.toLowerCase() && isShowable(p)
    );
    if (pinned) return pinned;
  }

  // Heuristic fallbacks.
  return (
    PAINTINGS.find(p => p.featured && isShowable(p)) ||
    PAINTINGS.find(p => isShowable(p)) ||
    PAINTINGS.find(p => p.available && !p.sold) ||
    PAINTINGS[0]
  );
}

/* ========================================================
   PAGE RENDERERS
   ======================================================== */

function getAllCollections() {
  const set = new Set();
  PAINTINGS.forEach(p => (p.collections || []).forEach(c => set.add(c)));
  return Array.from(set).sort();
}

function renderHero() {
  const heroPiece = getHeroPiece();

  // Build credit on two lines: painting credit on top, social-proof stat
  // (sold count) underneath. Concatenating them into one line read as if
  // the painting itself were "N paintings in private collections" —
  // hence the split. Sold count only shown when meaningful (>=3) so a
  // brand-new studio doesn't read empty.
  const soldCount = PAINTINGS.filter(p => p.sold).length;
  const heroSize = heroPiece ? formatDimensions(heroPiece).split(' / ')[0] : '';
  const creditWork = heroPiece
    ? [
        heroPiece.title,
        heroPiece.medium ? capitalize(heroPiece.medium) : '',
        heroSize
      ].filter(Boolean).join(' <span class="sep">&middot;</span> ')
    : '';
  const creditStat = soldCount >= 3
    ? `${soldCount} paintings in private collections`
    : '';

  // Pre-paint hero aspect ratio: prefer Sheet dims so the box is the right
  // shape on first render (no CLS). Falls back to a portrait default.
  const heroRatio = heroPiece ? aspectRatioFor(heroPiece) : '4/5';

  // Hero image is interactive only when there's a painting to open.
  // Rendered as a <button> for keyboard accessibility (Enter/Space free);
  // when there's no piece, render a plain non-interactive div.
  const heroImageHTML = heroPiece
    ? paintingImage(heroPiece, { isHero: true, heroRatioVar: true })
    : '<div class="hero-placeholder"></div>';

  const heroBox = heroPiece
    ? `<button type="button" class="hero-image-wrap" style="--hero-ratio: ${heroRatio};"
         onclick="openModal(${heroPiece.id})"
         aria-label="Open details for ${heroPiece.title}">${heroImageHTML}</button>`
    : `<div class="hero-image-wrap" style="--hero-ratio: ${heroRatio};">${heroImageHTML}</div>`;

  return `
    <section class="hero" aria-label="Featured painting">
      <div class="hero-text">
        <img class="hero-portrait" src="https://lh3.googleusercontent.com/d/1b-kjtmZ97SymW3DDZ7VI7XlgRNajyztm=w600" onerror="this.onerror=null; this.src='images/sveta-portrait.jpg'" alt="Sveta, the painter" width="604" height="572" fetchpriority="high">
        ${textBlock('home', 'headline') ? `<h1 class="hero-title">${textLines(textBlock('home', 'headline'))}</h1>` : ''}
        ${textBlock('home', 'under headline') ? `<p class="hero-lede">${textBlock('home', 'under headline').split('\n').map(l => l.trim()).filter(Boolean).map(l => `<span>${escText(l)}</span>`).join(' ')}</p>` : ''}
        ${creditStat ? `<p class="hero-stat">${creditStat}</p>` : ''}
      </div>
      <figure class="hero-figure">
        ${heroBox}
        ${creditWork ? `<figcaption class="hero-credit">${creditWork}</figcaption>` : ''}
      </figure>
    </section>`;
}

// Size-class label for the /works chapters. Today the studio inventory
// clusters into two formats — 16×20 in (large) and 11×14 in (small) — so
// the page reads as two rooms rather than one flat 11-painting feed.
// `area` is in square inches; anything ≥ 300 sq in is treated as "large"
// (16×20 = 320; 11×14 = 154). Falls back to a single chapter when paintings
// don't carry dimensions yet.
function sizeChapterFor(p) {
  if (!p.widthIn || !p.heightIn) return 'unknown';
  return (p.widthIn * p.heightIn) >= 300 ? 'large' : 'small';
}

function renderPaintings() {
  // /works shows the WHOLE body of work — available paintings and pieces
  // already in private collections, side by side. Each sold card renders
  // "Sold" in its price slot and carries an .is-sold class for the muted
  // visual treatment. /past remains as a sold-only archive view reachable
  // by URL, but isn't linked from here anymore.
  const works = PAINTINGS;

  // Partition by size class. Interleave portrait/landscape within each
  // chapter so adjacent same-orientation cards don't stack into bands.
  const large = interleaveByOrientation(works.filter(p => sizeChapterFor(p) === 'large'));
  const small = interleaveByOrientation(works.filter(p => sizeChapterFor(p) === 'small'));
  const unknown = works.filter(p => sizeChapterFor(p) === 'unknown');

  const chapter = (title, items, id) => items.length
    ? `<section aria-labelledby="${id}" class="works-chapter">
         <div class="section-inner">
           <h2 id="${id}" class="hang-chapter">${title}</h2>
           <div class="gallery-grid" data-masonry>
             ${items.map(cardHTML).join('')}
           </div>
         </div>
       </section>`
    : '';

  const emptyMsg = `<section><div class="section-inner"><p style="text-align:center;color:var(--text-muted);font-family:var(--font-body);">No paintings yet.</p></div></section>`;

  // When every painting carries dimensions: render two real chapters.
  // When some are missing dims: render an extra "Other works" chapter so
  // nothing silently disappears.
  let body;
  if (!works.length) {
    body = emptyMsg;
  } else if (large.length + small.length === 0) {
    // No dimensions on any painting — fall back to one undifferentiated grid.
    body = `<section><div class="section-inner"><div class="gallery-grid" data-masonry>${unknown.map(cardHTML).join('')}</div></div></section>`;
  } else {
    body = chapter('Large works &mdash; 16 &times; 20 in', large, 'works-large')
         + chapter('Small works &mdash; 11 &times; 14 in', small, 'works-small')
         + chapter('Other works', interleaveByOrientation(unknown), 'works-other');
  }

  return `
    <div class="collection-header">
      <a href="#home" class="back-link" onclick="event.preventDefault(); showPage('home');">&larr; Back</a>
      <h1>All paintings</h1>
      <p>Every painting one-of-a-kind. Available works and pieces already in private collections &mdash; commission requests welcome.</p>
    </div>
    ${body}
    ${renderContactSection()}
  `;
}

// Thumbnail for a collection's picture tab: first unsold painting with an
// image (sold ones are still fine as a fallback — the tab is navigation,
// not a sales pitch).
// Position of painting p inside collection `name`, from the sheet's `order`
// column: "3" applies to every collection, "Forest:2,Seasons:5" per
// collection. Unnumbered → Infinity (after the numbered ones).
function orderIn(p, name) {
  const fromColl = p.collOrder && p.collOrder[name.toLowerCase()];
  if (typeof fromColl === 'number') return fromColl;
  const raw = String(p.order || '').trim();
  if (!raw) return Infinity;
  if (/^\d+(\.\d+)?$/.test(raw)) return parseFloat(raw);
  const want = name.toLowerCase();
  for (const part of raw.split(',')) {
    const m = part.match(/^\s*(.+?)\s*:\s*(\d+(?:\.\d+)?)\s*$/);
    if (m && m[1].toLowerCase() === want) return parseFloat(m[2]);
  }
  return Infinity;
}

// A collection's paintings in Sveta's order: numbered first (ascending),
// then the rest in sheet order. Array.sort is stable, so ties keep sheet order.
function collectionItems(name) {
  return PAINTINGS
    .filter(p => (p.collections || []).includes(name))
    .map((p, i) => ({ p, i, o: orderIn(p, name) }))
    .sort((a, b) => (a.o - b.o) || (a.i - b.i))
    .map(x => x.p);
}

// The collection's button picture: the painting whose `cover` column names
// it; otherwise the first available painting in the collection's order.
function collectionCover(name) {
  const inCol = collectionItems(name).filter(p => p.image);
  const want = name.toLowerCase();
  return inCol.find(p => (p.cover || []).includes(want)) || inCol.find(x => !x.sold) || inCol[0];
}

function collectionThumb(name, px, cls) {
  const p = collectionCover(name);
  if (!p) return '';
  const src = p.image.indexOf('lh3.googleusercontent.com') !== -1 ? `${p.image}=w${px || 160}` : p.image;
  return `<img class="${cls || 'thumb'}" src="${src}" alt="" loading="lazy" decoding="async" width="48" height="60">`;
}

function renderPastWork() {
  // Sold pieces sorted by year descending (most recent first); pieces
  // without a year fall to the end but keep their relative Sheet order.
  const sold = PAINTINGS.filter(p => p.sold).slice().sort((a, b) => {
    const ya = parseInt(a.year, 10);
    const yb = parseInt(b.year, 10);
    const aOk = !isNaN(ya);
    const bOk = !isNaN(yb);
    if (aOk && bOk) return yb - ya;
    if (aOk) return -1;
    if (bOk) return 1;
    return 0;
  });
  return `
    <div class="collection-header">
      <a href="#home" class="back-link" onclick="event.preventDefault(); showPage('home');">&larr; Back</a>
      <h1>Past work</h1>
      <p>Paintings that have found homes. Browse for atmosphere &mdash; or write to commission something in a similar mood.</p>

function pageTitleFor(page) {
  const SUFFIX = 'Sveta Colours';
  if (page === 'home')        return `${SUFFIX} — Original Paintings`;
  if (page === 'recent')      return `Recent · ${SUFFIX}`;
  if (page === 'paintings')   return `All Paintings · ${SUFFIX}`;
  if (page === 'postcards')   return `Postcards · ${SUFFIX}`;
  if (page === 'collections') return `Collections · ${SUFFIX}`;
  if (page === 'about')       return `About · ${SUFFIX}`;
  if (page === 'faq')         return `FAQ · ${SUFFIX}`;
  if (page === 'past')        return `Past Work · ${SUFFIX}`;
  if (page.startsWith('collection:')) {
    let name = page.split(':').slice(1).join(':');
    try { name = decodeURIComponent(name); } catch (e) { /* ignore */ }
    return `${name} · ${SUFFIX}`;
  }
  return SUFFIX;
}

function render() {
  const app = document.getElementById('app');
  let html;
  if (currentPage.startsWith('collection:')) {
    let raw = currentPage.split(':').slice(1).join(':');
    try { raw = decodeURIComponent(raw); } catch (e) { /* ignore */ }
    html = renderCollectionDetail(raw);
  } else switch (currentPage) {
    case 'recent':      html = renderRecent(); break;
    case 'paintings':   html = renderPaintings(); break;
    case 'postcards':   html = renderPostcards(); break;
    case 'collections': html = renderCollections(); break;
    case 'about':       html = renderAbout(); break;
    case 'faq':         html = renderFAQ(); break;
    case 'past':        html = renderPastWork(); break;
    default:            html = renderHome(); break;
  }
  app.innerHTML = html;

  // LCP hint: promote the first image in each gallery grid. On home and
  // /works that image is almost always the largest contentful paint, so
  // asking the browser to fetch it ahead of the rest meaningfully improves
  // perceived load. Lazy-loading stays on for the rest via paintingImage().
  document.querySelectorAll('.gallery-grid').forEach(grid => {
    const firstImg = grid.querySelector('img');
    if (firstImg) firstImg.setAttribute('fetchpriority', 'high');
  });

  // Update <title>
  document.title = pageTitleFor(currentPage);

  // Re-render footer (it depends on SITE_DATA which is stable, but page links
  // benefit from being injected after main)
  renderFooter();

  // Update active nav link
  document.querySelectorAll('nav .nav-links a').forEach(a => { a.classList.remove('active'); a.removeAttribute('aria-current'); });
  let navKey = '';
  if (currentPage === 'home') navKey = 'home';
  else if (currentPage === 'recent') navKey = 'recent';
  else if (currentPage === 'paintings' || currentPage === 'past') navKey = 'paintings';
  else if (currentPage === 'collections' || currentPage.startsWith('collection:')) navKey = 'collections';
  else if (currentPage === 'postcards') navKey = 'postcards';
  else if (currentPage === 'about') navKey = 'about';
  else if (currentPage === 'faq') navKey = 'faq';
  if (navKey) {
    const link = document.querySelector(`nav .nav-links a[data-page="${navKey}"]`);
    if (link) { link.classList.add('active'); link.setAttribute('aria-current', 'page'); }
  }
  renderNavCollections();

  requestAnimationFrame(() => {
    document.querySelectorAll('.reveal').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), Math.min(i * 50, 600));
    });
    // Flex layout handles card sizing — masonry no longer needed.
  });

  // Wire up the custom cursor for newly-rendered cards
  wireCustomCursor();
}

/* ========================================================
   CSS GRID MASONRY — refines the pre-seeded span (cardHTML emits an
   estimated `grid-row: span N` from aspect-ratio + viewport-based column
   width). computeMasonry() runs after layout and again on image-load to
   correct the seed against the real rendered height. With grid-auto-rows
   fixed at 8px from page-load, there is no FOUC class to toggle.
   ======================================================== */
function computeMasonry() {
  document.querySelectorAll('.gallery-grid[data-masonry]').forEach(grid => {
    const rowH = parseFloat(getComputedStyle(grid).gridAutoRows) || 8;
    const rowGap = parseFloat(getComputedStyle(grid).rowGap) || 0;
    grid.querySelectorAll('.painting-card').forEach(card => {
      // Sum children's natural heights instead of measuring the card itself.
      // With grid-auto-rows: 8px + align-items: stretch (grid default), the
      // card's own bounding rect reflects its grid-allocated height — clearing
      // grid-row would collapse it to 8px, not reveal its natural content.
      // The block-flow children (.card-image and .card-info) report their
      // real rendered heights regardless of the card's forced cell size.
      const img = card.querySelector('.card-image');
      const info = card.querySelector('.card-info');
      const imgH = img ? img.getBoundingClientRect().height : 0;
      const infoH = info ? info.getBoundingClientRect().height : 0;
      const mb = parseFloat(getComputedStyle(card).marginBottom) || 0;
      const h = imgH + infoH + mb;
      if (h <= 0) return; // no children laid out yet — skip
      const span = Math.ceil((h + rowGap) / (rowH + rowGap));
      card.style.gridRow = `span ${span}`;
    });
  });
}

// Flex layout reflows automatically on resize — no JS masonry needed.

/* ========================================================
   CUSTOM CURSOR — disabled on touch + reduced-motion
   ======================================================== */
let cursorEl = null;
function initCustomCursor() {
  if (!window.matchMedia) return;
  if (window.matchMedia('(hover: none)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  cursorEl = document.createElement('div');
  cursorEl.className = 'custom-cursor';
  cursorEl.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cursorEl);

  // Throttle cursor updates through requestAnimationFrame to avoid
  // hundreds of style writes per second on a fast mouse.
  let cursorRAF = null;
  let lastX = 0, lastY = 0;
  document.addEventListener('mousemove', (e) => {
    lastX = e.clientX;
    lastY = e.clientY;
    if (!cursorEl) return;
    if (cursorRAF) return;
    cursorRAF = requestAnimationFrame(() => {
      cursorRAF = null;
      if (!cursorEl) return;
      // Single transform write per frame; cheaper than left/top.
      cursorEl.style.transform = `translate(${lastX}px, ${lastY}px) translate(-50%, -50%) scale(${cursorEl.classList.contains('visible') ? 1 : 0.6})`;
    });
  }, { passive: true });
}

function wireCustomCursor() {
  if (!cursorEl) return;
  const showCursor = () => {
    cursorEl.classList.add('visible');
    document.body.classList.add('cursor-hide');
  };
  const hideCursor = () => {
    cursorEl.classList.remove('visible');
    document.body.classList.remove('cursor-hide');
  };
  const resolveTitle = (painting) => {
    if (!painting || !painting.title) return null;
    return painting.title.length > 26 ? painting.title.slice(0, 24) + '…' : painting.title;
  };

  // Scope the custom cursor to the painting IMAGE only — not the whole card.
  // Hovering the title/meta/Commission button below the image no longer
  // shows the cursor, which used to keep "View 'X'" visible (and visually
  // covering the very text the buyer wanted to read) until the entire card
  // was exited.
  const cardImages = document.querySelectorAll('.painting-card .card-image-inner');
  cardImages.forEach(t => {
    if (t._cursorWired) return;
    t._cursorWired = true;
    t.addEventListener('mouseenter', () => {
      let label = 'View →';
      const card = t.closest('.painting-card');
      if (card) {
        const id = parseInt(card.getAttribute('data-card-id'), 10);
        const painting = !isNaN(id) ? PAINTINGS.find(p => p.id === id) : null;
        const title = resolveTitle(painting);
        if (title) label = `${title} →`;
      }
      cursorEl.textContent = label;
      showCursor();
    });
    t.addEventListener('mouseleave', hideCursor);
  });

  // Hero image gets the same treatment — cursor over the painting only.
  document.querySelectorAll('.hero-image-wrap').forEach(t => {
    if (t._cursorWired) return;
    t._cursorWired = true;
    t.addEventListener('mouseenter', () => {
      let label = 'View →';
      const title = resolveTitle(getHeroPiece());
      if (title) label = `${title} →`;
      cursorEl.textContent = label;
      showCursor();
    });
    t.addEventListener('mouseleave', hideCursor);
  });
}

/* ========================================================
   STICKY MOBILE CTA — appears once scrolled past hero.
   Only meaningful at ≤768px (CSS gates visibility).
   ======================================================== */
function initMobileCTA() {
  const cta = document.getElementById('mobileCTA');
  if (!cta) return;
  // mailto stays as the href (long-press, no JS); a tap opens the form.
  cta.setAttribute('href', `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent('Hello from sveta-colours.com')}`);
  cta.addEventListener('click', openContact);
  let ticking = false;
  const onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      // Trigger after we've scrolled most of the way past the hero.
      // Threshold roughly = hero-image-wrap bottom; we approximate via
      // 60% of viewport height which suits the typical 4/5 hero on phones.
      const trigger = window.innerHeight * 0.6;
      if (window.scrollY > trigger) cta.classList.add('visible');
      else cta.classList.remove('visible');
    });
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

// Boot
initCustomCursor();
initMobileCTA();
if (SHEET_CSV_URL) loadFromSheet();
else textsReady.then(() => { assignCatalogNumbers(); injectPaintingsLD(); togglePostcardsNav(); currentPage = pageFromHash(window.location.hash) || 'home'; render(); hydrateFromHash(); });
</script>

CURATION
C1. Featured grid algorithm: selectFeatured(paintings, count=8,
    excludeHeroId). (1) Pin up to 4 paintings flagged featured,
    excluding hero, excluding sold. (2) Fill from
    available/!sold/has-image in Sheet order. (3) Last-resort
    fill from any remaining available pieces. (4) Anti-cluster:
    split by orientation (ratio>1 = landscape, ≤1 = portrait),
    zip-merge starting with the larger bucket so we never get
    three portraits or three landscapes in a row.
C2. /works is now available-only — sold pieces moved to /past
    (which sorts by year desc, then by Sheet order for years-
    missing). /works adds a "See past work (N)" link when
    there's any. Sold tag stays out of /works cards.
C3. Hero pickup never picks a sold piece. New priority:
    featured && available && !sold && image → available &&
    !sold && image → available && !sold → first.
C4. Sold cards drop the price entirely (art-critic note: a
    struck-through "$500 Sold" reads as Shopify). Cards now
    show "Sold" italic tag next to the title and no price.
    The struck-through price is retained inside the modal,
    where it informs.

MODAL
M1. Description renders IN FULL. truncateDescription() is a
    safety guard only (DESC_MAX_CHARS = 400, word-boundary cut,
    ellipsis when trimmed). The earlier "first 2 sentences OR
    240 chars, whichever is shorter" rule was removed 2026-08-23:
    it cut 20 of 21 live descriptions, always dropping the
    closing sentence where the voice spec puts the hedge.
M2. Meta table split: primary fields (Size, Medium, Year,
    Signed) always visible; secondary fields (Framing, Ships
    from, Authenticity) collapsed into a <details>Details</>
    block. Keeps the primary scan tight.
M3. Mobile modal image: replaced fixed min-height: 280px /
    max-height: 50vh with aspect-ratio: var(--ratio) +
    min-height: 240px / max-height: 70vh. Paintings get real
    height on phones.
M4. paintingMeta() no longer appends a trailing dot. Switched
    separator from ". " to " · " for an editorial credit-line
    feel ("Acrylic on canvas · 2024 · 16 × 20 in / 40.6 × 50.8
    cm").

COPY
T1. Modal CTA note: "Typical reply within 24 hours · Worldwide
    shipping with insurance · 14-day returns" → "Replies
    within a day or two. Shipped from Canada, insured."
T2. Sold message in modal: "This piece has found a home. Write
    to commission something similar..." → "Sold. Write if
    you'd like a similar commission."
T3. Hero h1 dropped the <br>: "Sveta<br><span class=italic>
    Colours</span>" → "Sveta <span class=italic>Colours</span>"
    on one line, which reads cleaner at every viewport (the
    clamp on font-size still keeps it on one line on phones).
T4. Section-title "studio" dedup: process section retitled
    from "The studio" to "On painting". "From the studio"
    (About preview eyebrow) and "From collectors" (testimonials)
    keep their meanings without colliding with Process.

NICE TO HAVE
N1. Hero credit line gains "${soldCount} paintings in private
    collections" when soldCount ≥ 3. Quiet social proof.
N2. Sticky mobile CTA bar (≤768px only) — fixed bottom, 56px
    tall, "Write to studio →" mailto. Appears after scrolling
    past ~60% of the viewport (i.e. past the hero); slides
    in/out with a transform transition (disabled under
    prefers-reduced-motion). Anchored as <a id="mobileCTA">
